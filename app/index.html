<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora de Trading</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M5 22l7-8 5 4 10-12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="top">
  <div class="brand">📈 Bitácora de Trading</div>
  <div class="top-ctl">
    <select id="accountSel" title="Cuenta" aria-label="Cuenta"></select>
    <select id="unitSel" title="Unidad" aria-label="Unidad"></select>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist">
  <button data-tab="resumen" class="on">Resumen</button>
  <button data-tab="stats">Estadísticas</button>
  <button data-tab="insights">Insights</button>
  <button data-tab="ops">Operaciones</button>
  <button data-tab="noticias">Noticias</button>
  <button data-tab="calc">Calculadora</button>
  <button data-tab="bitacora">Bitácora</button>
  <button data-tab="datos">Datos</button>
</nav>

<div class="alert-bar" id="alertBar" role="alert" hidden></div>
<div class="news-bar" id="newsBar" role="status" hidden></div>

<section class="filters" id="filters">
  <label>Periodo
    <select id="periodSel">
      <option value="all">Todo</option>
      <option value="7">Últimos 7 días</option>
      <option value="30">Últimos 30 días</option>
      <option value="month">Último mes calendario</option>
      <option value="custom">Rango…</option>
    </select>
  </label>
  <label class="custom">Desde <input type="date" id="fromDate"></label>
  <label class="custom">Hasta <input type="date" id="toDate"></label>
  <label>Símbolo <select id="symbolSel"></select></label>
  <span class="hint" id="rangeHint"></span>
</section>

<main id="main">
  <div id="view-resumen" class="view"></div>
  <div id="view-stats" class="view" hidden></div>
  <div id="view-insights" class="view" hidden></div>
  <div id="view-ops" class="view" hidden></div>
  <div id="view-noticias" class="view" hidden></div>
  <div id="view-calc" class="view" hidden></div>
  <div id="view-bitacora" class="view" hidden></div>
  <div id="view-datos" class="view" hidden></div>
</main>

<dialog id="tradeDlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<footer class="foot">
  Tus datos se guardan solo en este navegador; nada se envía a ningún servidor. <span id="tzNote">Horas y fechas en hora de Costa Rica.</span>
  Los insights son orientativos y educativos, no constituyen asesoría financiera.
</footer>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
